name: Informe semanal de ciberseguridad

on:
  schedule:
    # 05:15 UTC equivale a las 23:15 del día anterior en Honduras.
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el proyecto
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Recopilar publicaciones recientes y conservar la semana
        run: python main.py collect
      - name: Generar PDF semanal y enviar correo si está configurado
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$(date -u +%u)" -eq 6 ]; then
            python main.py report
          else
            echo "Recopilación diaria terminada. El PDF se genera los viernes por la noche en Honduras."
          fi
      - name: Guardar la recopilación semanal en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weekly_entries.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualiza publicaciones de ciberseguridad"
            git push
          fi
      - name: Subir el PDF como artefacto descargable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-semanal-ciberseguridad
          path: reportes/*.pdf
          if-no-files-found: ignore
          retention-days: 90
