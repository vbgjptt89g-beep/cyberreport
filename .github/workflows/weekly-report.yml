name: Informe semanal de ciberseguridad

on:
  schedule:
    # Todos los lunes a las 08:00 UTC (ajusta la hora a tu zona si quieres)
    - cron: "0 8 * * 1"
  workflow_dispatch: {}  # permite ejecutarlo manualmente desde la pestaña "Actions"

jobs:
  generar-informe:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar y enviar el informe
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python main.py

      - name: Subir el PDF como artefacto del run
        uses: actions/upload-artifact@v4
        with:
          name: informe-ciberseguridad
          path: reportes/*.pdf

      - name: Guardar el PDF en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reportes/*.pdf
          git commit -m "Informe semanal de ciberseguridad $(date +'%Y-%m-%d')" || echo "Nada que commitear"
          git push
