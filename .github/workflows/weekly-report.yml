name: Informe semanal de ciberseguridad

on:
  push:
    branches: [main]
    paths:
      - 'site/index.html'
      - 'site/assets/**'
      - 'site/weekly_entries.json'
      - 'site/informe.pdf'
      - 'data/weekly_entries.json'
      - '.github/workflows/weekly-report.yml'
  schedule:
    # 05:15 UTC equivale a las 23:15 del día anterior en Honduras.
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect-and-report:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 20
    steps:
      - name: Obtener el proyecto
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
        timeout-minutes: 2

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
        timeout-minutes: 3

      - name: Recopilar publicaciones recientes y conservar la semana
        run: python -u main.py collect
        timeout-minutes: 2

      - name: Generar PDF semanal y enviar correo si está configurado
        id: report
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || { [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$(date -u +%u)" -eq 6 ]; } || { [ "$GITHUB_EVENT_NAME" = "push" ] && [ ! -f site/informe.pdf ]; }; then
            python -u main.py report
            echo "generated=true" >> "$GITHUB_OUTPUT"
          else
            echo "Recopilación diaria terminada. El PDF se genera los viernes por la noche en Honduras."
            echo "generated=false" >> "$GITHUB_OUTPUT"
          fi
        timeout-minutes: 10

      - name: Subir el PDF como artefacto descargable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-semanal-ciberseguridad
          path: reportes/*.pdf
          if-no-files-found: ignore
          retention-days: 90
        timeout-minutes: 2
      - name: Guardar publicaciones y el último informe
        run: |
          if [ "${{ steps.report.outputs.generated }}" = "true" ]; then
            pdf_path="$(find reportes -maxdepth 1 -type f -name 'informe-ciberseguridad-*.pdf' -print | sort | tail -n 1)"
            test -n "$pdf_path"
            cp "$pdf_path" site/informe.pdf
          fi
          cp data/weekly_entries.json site/weekly_entries.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weekly_entries.json site/weekly_entries.json
          if [ -f site/informe.pdf ]; then git add site/informe.pdf; fi
          if ! git diff --cached --quiet; then
            git commit -m "Actualiza publicaciones e informe semanal"
            git push
          fi
        timeout-minutes: 2

      - name: Preparar la página y los datos para GitHub Pages
        run: |
          mkdir -p site-build
          cp site/index.html site-build/index.html
          cp data/weekly_entries.json site-build/weekly_entries.json
          if [ -d site/assets ]; then cp -R site/assets site-build/assets; fi
          if [ -f site/informe.pdf ]; then cp site/informe.pdf site-build/informe.pdf; fi
        timeout-minutes: 1

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir el sitio a GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site-build

      - name: Publicar el sitio en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
